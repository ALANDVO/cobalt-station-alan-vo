services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicestudio-backend
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/voicestudio.db
      - TTS_MODEL=tts_models/multilingual/multi-dataset/xtts_v2
      - TTS_DEVICE=cpu
      - TTS_CACHE_DIR=/models/tts
      - FRONTEND_URL=http://localhost:5173
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=voicestudio
      - KEYCLOAK_CLIENT_ID=voicestudio-frontend
      - OIDC_ISSUER=http://keycloak:8080/realms/voicestudio
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-secure-random-32-bytes}
    volumes:
      - backend-data:/app/data
      - tts-cache:/models/tts
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    user: "1000:1000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voicestudio-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=voicestudio
      - VITE_KEYCLOAK_CLIENT_ID=voicestudio-frontend
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - backend
    restart: unless-stopped
    user: "1000:1000"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: voicestudio-keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8080
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  backend-data:
  tts-cache:
  keycloak-data:

networks:
  default:
    name: voicestudio-network